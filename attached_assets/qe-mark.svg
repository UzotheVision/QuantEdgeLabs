<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quant Edge Labs">
  <!-- Quant Edge Labs mark: the blue Q from the brand artwork, redrawn as vector
       so it stays crisp from a 16px favicon to a 512px app icon. Pixels dissolve
       into the ring from the left; the tail cuts through at the lower right. -->
  <defs>
    <linearGradient id="qe-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="0.45" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#1257d6"/>
    </linearGradient>
    <linearGradient id="qe-tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ad3ff"/>
      <stop offset="1" stop-color="#2a7ff5"/>
    </linearGradient>
    <linearGradient id="qe-px" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f9bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4aa6ff"/>
    </linearGradient>
  </defs>
  <!-- ring -->
  <circle cx="38" cy="29" r="15.5" fill="none" stroke="url(#qe-ring)" stroke-width="7.5"/>
  <!-- tail -->
  <path d="M33.5 33.5 L41 30 L59 52.5 L50.5 55 Z" fill="url(#qe-tail)"/>
  <!-- pixel dissolve -->
  <g fill="url(#qe-px)">
    <rect x="17.5" y="9"  width="5" height="5" rx="0.6"/>
    <rect x="11"   y="15" width="4" height="4" rx="0.5"/>
    <rect x="17"   y="16" width="5" height="5" rx="0.6"/>
    <rect x="4"    y="20" width="3" height="3" rx="0.4"/>
    <rect x="9"    y="22" width="4" height="4" rx="0.5"/>
    <rect x="15.5" y="24" width="4.5" height="4.5" rx="0.6"/>
    <rect x="6"    y="29" width="3" height="3" rx="0.4"/>
    <rect x="12"   y="31" width="4" height="4" rx="0.5"/>
    <rect x="18"   y="32" width="5" height="5" rx="0.6"/>
    <rect x="9"    y="38" width="3" height="3" rx="0.4"/>
    <rect x="15"   y="39" width="4" height="4" rx="0.5"/>
    <rect x="21"   y="40" width="5" height="5" rx="0.6"/>
  </g>
</svg>
